<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GETGGUL Terminal | 비트코인 분석 리포트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #6366f1; --main-red: #f43f5e; --main-amber: #f59e0b; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* [1. 하이브리드 레이아웃 엔진] */
        .terminal-split { display: flex; flex-direction: column; gap: 2rem; }
        @media (min-width: 1024px) {
            .terminal-split { flex-direction: row; gap: 2.5rem; }
            .sticky-chart { width: 55%; height: calc(100vh - 140px); position: sticky; top: 110px; display: block !important; }
            .scroll-content { width: 45%; }
        }

        /* [2. 프로세스 내비게이션] */
        #process-bar { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .step-node { font-size: 10px; font-weight: 900; color: #475569; transition: 0.4s; }
        .step-node.active { color: var(--main-blue); border-bottom: 2px solid var(--main-blue); padding-bottom: 2px; }

        /* [3. 컴포넌트 디자인] */
        .glass-panel { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; transition: 0.4s; }
        .glass-panel.active { border-color: var(--main-blue); box-shadow: 0 0 40px rgba(99, 102, 241, 0.15); }
        .perspective-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.7); }

        /* [4. 딥다이브 분석 노트 (SEO)] */
        .analysis-note { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0, 1, 0, 1); background: rgba(15, 23, 42, 0.5); border-radius: 1.5rem; }
        .analysis-note.expanded { max-height: 2000px; transition: max-height 1s ease-in-out; margin-top: 1rem; padding: 1.5rem; border: 1px solid rgba(99, 102, 241, 0.2); }

        .img-box { width: 100%; height: auto; min-height: 240px; background: #000; display: flex; justify-content: center; border-radius: 1.5rem; overflow: hidden; position: relative; }
        .fit-img { max-width: 100%; height: auto; object-fit: contain; }
    
        /* index.html 100% 모바일 메뉴 애니메이션 및 스타일 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6e5ce6;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .nav-item {
                color: #1a202c !important;
            }
        }
    
        /* v3 메인(v3/index.html) 100% 모바일 메뉴 애니메이션 및 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6366f1;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="pb-20">

    <nav id="process-bar" class="sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="font-black italic text-xl tracking-tighter text-white underline decoration-indigo-500 decoration-4">GETGGUL TERMINAL</div>
            <div class="flex gap-4 md:gap-10">
                <div class="step-node active" id="node-0">01.복기</div>
                <div class="step-node" id="node-1">02.대관점</div>
                <div class="step-node" id="node-2">03.시나리오</div>
                <div class="step-node" id="node-3">04.전략</div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto mt-10 px-6">
        
        <section id="sec-feedback" class="mb-32">
            <h2 class="text-xs font-black tracking-[0.3em] text-slate-500 uppercase mb-8 flex items-center gap-4">
                Analysis Feedback <div class="h-px bg-slate-800 flex-1"></div>
            </h2>
            <div id="feedback-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <div class="terminal-split">
            
            <aside class="sticky-chart w-full">
                <div class="glass-panel h-full overflow-hidden relative flex flex-col min-h-[350px]">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
                        <span id="chart-tag" class="text-[10px] font-black uppercase text-indigo-400 tracking-widest italic">Today's Main Chart</span>
                        <div class="flex gap-1"><div class="w-2 h-2 rounded-full bg-rose-500"></div><div class="w-2 h-2 rounded-full bg-emerald-500"></div></div>
                    </div>
                    <div class="flex-1 flex items-center justify-center p-4 bg-black/40">
                        <img id="main-chart-display" src="macroA.jpg" class="max-w-full max-h-full object-contain shadow-2xl">
                    </div>
                    <div class="p-6 bg-slate-900/90 backdrop-blur-md border-t border-white/5">
                        <h3 id="display-title" class="text-xl font-black italic mb-1 text-white">관점을 선택해 주세요</h3>
                        <p id="display-desc" class="text-[11px] text-slate-400 font-bold">대관점을 클릭하면 상세 분석이 활성화됩니다.</p>
                    </div>
                </div>
            </aside>

            <div class="scroll-content space-y-32">
                
                <section id="sec-macro">
                    <div class="mb-8 text-indigo-500 font-black text-xs uppercase tracking-widest italic border-b border-indigo-500/30 pb-2">02. Macro Selection</div>
                    <div id="macro-list" class="space-y-4"></div>
                </section>

                <section id="sec-sub" class="hidden">
                    <div class="mb-8 text-indigo-400 font-black text-xs uppercase tracking-widest italic border-b border-indigo-400/30 pb-2">03. Sub Scenarios</div>
                    <div id="sub-list" class="space-y-4"></div>
                </section>

                <section id="sec-strategy" class="hidden">
                    <div class="mb-8 text-emerald-500 font-black text-xs uppercase tracking-widest italic border-b border-emerald-500/30 pb-2">04. Execution Logic</div>
                    <div id="strategy-area" class="space-y-8"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="zoom-modal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl" onclick="this.classList.add('hidden')">
        <img id="modal-img" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl">
    </div>

    <script>
        // [9x4 완전 무결 데이터 셋]
        const masterData = {
            feedback: [
                { id:"A", status:"maintained", date:"03.22", title:"임펄스 종결", desc:"$64.5K 지지 성공", note:"메인 관점에서 상정했던 지그재그 조정의 C파 종결 지점이 명확하게 지지되는 흐름입니다. 현재 반등의 거래량이 실리고 있어 신뢰도가 높습니다.", img:"prevA.jpg" },
                { id:"B", status:"discarded", date:"03.22", title:"추가 하방 확장", desc:"상단 저항 돌파로 폐기", note:"$69,000 저항 구간을 장대 양봉으로 돌파하며 하락 5파 연장 가능성은 차트적으로 소멸되었습니다. 이에 따라 상방 관점을 강화합니다.", img:"prevB.jpg", reason:"$69,000 매물대 강력 돌파 및 지지 안착" }
            ],
            macros: [
                { id:"A", title:"상승 반전 (Main)", prob:"60%", color:"indigo", desc:"하락 5파 종결 후 새로운 상승 파동 시작", logic:"주봉 단위 RSI 상승 다이버전스와 함께 엘리어트 파동상 하락 임펄스의 5파가 절단 혹은 종결된 것으로 해석됩니다. 강력한 지지 매물대인 $64K 구간을 사수한 것이 핵심 근거입니다." },
                { id:"B", title:"박스권 횡보 (Neutral)", prob:"30%", color:"amber", desc:"WXY 복합 조정을 통한 기간 조정 연장", logic:"고점 돌파 실패 시 시장은 다시 수렴 혹은 박스권의 형태를 띠게 됩니다. 거래량이 줄어들며 변동성이 죽는 장세에 대비해야 하는 시나리오입니다." },
                { id:"C", title:"하락 확장 (Risk)", prob:"10%", color:"rose", desc:"반등 실패 후 전저점 이탈 시나리오", logic:"현재의 반등이 단순 ABC 데드캣 바운스일 가능성입니다. $60K 붕괴 시 투매 물량이 쏟아지며 하락 5파가 확장될 위험이 있으므로 항상 손절 라인을 준수해야 합니다." }
            ],
            subs: {
                "A": [
                    { id:"A-1", title:"지그재그 ABC 조정", desc:"0.618 지지 타점", img:"subA1.jpg", review:"🚀 [A-1] 지지 이탈 전까지 '공격적 매수'가 유효한 손익비 최적 구간입니다.", logic:"현 하락을 상승 1파에 대한 2파 조정으로 볼 때, 피보나치 0.618 부근은 가장 신뢰도 높은 반등 지점입니다. 캔들의 꼬리가 달리는 지점을 주목하세요." },
                    { id:"A-2", title:"삼각 수렴 상방 돌파", desc:"강력한 발산 예고", img:"subA2.jpg", review:"🔥 [A-2] 수렴 돌파 시 숏 스퀴즈를 동반한 폭발적 상승에 올라타야 합니다.", logic:"수렴의 폭이 좁아지며 에너지가 응축되고 있습니다. 볼린저 밴드의 수축 이후 이탈은 대시세의 시작점이 되는 경우가 많습니다." },
                    { id:"A-3", title:"플랫형 조정 마무리", desc:"매물대 지지 테스트", img:"subA3.jpg", review:"⏳ [A-3] 지루한 횡보이나 물량을 모으기에는 가장 안전한 자리입니다.", logic:"파동의 기울기가 완만한 플랫 형태는 세력의 매집이 길어지는 신호입니다. 시간은 걸리나 하방 리스크가 가장 적은 경로입니다." }
                ],
                "B": [
                    { id:"B-1", title:"박스권 하단 횡보", desc:"레인지 매매 유효", img:"subB1.jpg", review:"📦 [B-1] 방향성이 나올 때까지 박스 하단 매수 전략을 유지하세요.", logic:"상단 저항과 하단 지지가 매우 명확한 상태입니다. 섣부른 돌파 예측보다는 박스권 사이클 매매가 수익률 방어에 유리합니다." },
                    { id:"B-2", title:"하위 파동 수렴 연장", desc:"변동성 축소 장세", img:"subB2.jpg", review:"💤 [B-2] 거래량이 죽어가는 구간입니다. 무리한 진입보다 관망을 권장합니다.", logic:"파동이 점차 작아지며 방향성을 탐색하는 구간입니다. 신호가 확실해질 때까지 현금 비중을 높여야 합니다." },
                    { id:"B-3", title:"복합 조정 WXY 완성", desc:"마지막 저점 확인", img:"subB3.jpg", review:"⚠️ [B-3] 한 차례 더 저점을 낮춘 후 반등할 가능성이 있는 구간입니다.", logic:"W-X-Y 형태로 지저분하게 파동이 흐를 때 나타나는 패턴입니다. 마지막 Y파동의 지점을 확인하는 것이 중요합니다." }
                ],
                "C": [
                    { id:"C-1", title:"임펄스 5파 하락", desc:"$60K 붕괴 주의", img:"subC1.jpg", review:"🚨 [C-1] 공포 구간입니다. 모든 매수 관점을 접고 방어적 태세를 갖추세요.", logic:"하락의 기울기가 가팔라지며 투매가 나올 수 있는 구간입니다. 지지선 붕괴 시 추격 숏 대응이 수익률 면에서 유리합니다." },
                    { id:"C-2", title:"하락 확장형 채널", desc:"지속적 고점 하락", img:"subC2.jpg", review:"📉 [C-2] 바닥 확인 전까지 매수 절대 금지. 보수적 대응뿐입니다.", logic:"고점과 저점이 동시에 낮아지는 하락 채널 내 움직임입니다. 채널 상단 저항이 워낙 강해 돌파 전까지는 하방이 우세합니다." },
                    { id:"C-3", title:"가짜 반등 후 폭락", desc:"데드캣 바운스 조심", img:"subC3.jpg", review:"🪤 [C-3] 기술적 반등에 속지 마세요. 일시적 속임수일 확률이 90%입니다.", logic:"숏 커버링 물량에 의한 반짝 반등입니다. 거래량이 실리지 않는 반등은 고점 매도(Short)의 기회가 될 뿐입니다." }
                ]
            },
            strategy: {
                "A-1": [ {label:"Entry", val:"$68,250", note:"0.618 지지"}, {label:"Stop Loss", val:"$66,400", note:"저점 이탈"}, {label:"Target", val:"$74,800", note:"1차 목표"}, {label:"Invalidation", val:"$65,900", note:"관점 B 전환"} ],
                "A-2": [ {label:"Entry", val:"$70.1K", note:"돌파 타점"}, {label:"Stop Loss", val:"$68.5K", note:"내부 회귀"}, {label:"Target", val:"$78K", note:"파동 목표"}, {label:"Invalidation", val:"$67K", note:"추세 이탈"} ],
                "A-3": [ {label:"Entry", val:"$67.2K", note:"하단 매수"}, {label:"Stop Loss", val:"$65.8K", note:"박스 붕괴"}, {label:"Target", val:"$72.5K", note:"박스 상단"}, {label:"Invalidation", val:"$64K", note:"매물대 이탈"} ],
                "B-1": [ {label:"Entry", val:"$64.5K", note:"박스 하단"}, {label:"Stop Loss", val:"$63K", note:"박스 이탈"}, {label:"Target", val:"$69K", note:"박스 상단"}, {label:"Invalidation", val:"$62K", note:"추세 붕괴"} ],
                "B-2": [ {label:"Entry", val:"관망", note:"대기"}, {label:"Stop Loss", val:"-", note:"-"}, {label:"Target", val:"-", note:"-"}, {label:"Invalidation", val:"$61K", note:"위험"} ],
                "B-3": [ {label:"Entry", val:"$63.5K", note:"분할 진입"}, {label:"Stop Loss", val:"$62K", note:"저점 갱신"}, {label:"Target", val:"$68K", note:"단기 반등"}, {label:"Invalidation", val:"$60K", note:"패닉 셀"} ],
                "C-1": [ {label:"Entry", val:"$67K 숏", note:"반등 매도"}, {label:"Stop Loss", val:"$69.2K", note:"강세 전환"}, {label:"Target", val:"$58K", note:"전저 하향"}, {label:"Invalidation", val:"$70K", note:"관점 폐기"} ],
                "C-2": [ {label:"Entry", val:"$65K 숏", note:"추격 대응"}, {label:"Stop Loss", val:"$66.5K", note:"단기 반등"}, {label:"Target", val:"$55K", note:"하단 목표"}, {label:"Invalidation", val:"$68K", note:"하락 둔화"} ],
                "C-3": [ {label:"Entry", val:"$66K 숏", note:"데드캣 타점"}, {label:"Stop Loss", val:"$68K", note:"추세 전환"}, {label:"Target", val:"$61K", note:"지지 목표"}, {label:"Invalidation", val:"$69.5K", note:"강력 반등"} ]
            }
        };

        // --- 렌더링 시스템 ---
        function renderFeedback() {
            const container = document.getElementById('feedback-list');
            masterData.feedback.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-6 opacity-80 perspective-card';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[9px] font-black text-slate-500 uppercase">${item.date} FEEDBACK</span>
                        <span class="text-[9px] font-black px-2 py-1 rounded-md ${item.status==='maintained'?'bg-emerald-500/10 text-emerald-400':'bg-rose-500/10 text-rose-400'} uppercase">${item.status}</span>
                    </div>
                    <h4 class="font-black text-lg mb-2 text-white">${item.title}</h4>
                    <p class="text-[11px] text-slate-400 font-bold mb-3">${item.desc}</p>
                    <button onclick="toggleNote('fb-${item.id}', this)" class="text-[9px] text-indigo-400 font-black uppercase tracking-tighter hover:text-white transition-all">Review Deep Dive <i class="fas fa-chevron-down ml-1"></i></button>
                    <div id="fb-${item.id}" class="analysis-note"><p class="text-xs text-slate-300 leading-relaxed">${item.note}</p></div>
                `;
                container.appendChild(card);
            });
        }

        function renderMacros() {
            const container = document.getElementById('macro-list');
            masterData.macros.forEach(m => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-6 flex items-center gap-6 cursor-pointer perspective-card group';
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center font-black text-white text-xl border border-white/5">${m.id}</div>
                    <div class="flex-1"><h3 class="font-black text-lg text-white group-hover:text-indigo-400 transition">${m.title}</h3><p class="text-[11px] text-slate-400 font-bold">${m.desc}</p></div>
                    <div class="text-right"><span class="text-2xl font-black text-indigo-400">${m.prob}</span></div>
                `;
                card.onclick = () => selectMacro(m.id, card, m);
                container.appendChild(card);
            });
        }

        function selectMacro(id, el, data) {
            document.querySelectorAll('#macro-list .glass-panel').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('main-chart-display').src = `macro${id}.jpg`;
            document.getElementById('display-title').innerText = data.title;
            document.getElementById('display-desc').innerText = data.desc;
            document.getElementById('chart-tag').innerText = `Macro Concept ${id}`;

            const subSec = document.getElementById('sec-sub');
            const subList = document.getElementById('sub-list');
            subSec.classList.remove('hidden');
            subList.innerHTML = `
                <div class="glass-panel p-6 mb-6 bg-indigo-500/5 border-indigo-500/20">
                    <h4 class="text-[10px] font-black text-indigo-400 mb-3 uppercase tracking-widest italic">Macro Logic Deep Dive</h4>
                    <p class="text-xs text-slate-300 leading-relaxed font-bold">${data.logic}</p>
                </div>
            `;
            masterData.subs[id].forEach(sub => {
                const subCard = document.createElement('div');
                subCard.className = 'glass-panel p-6 cursor-pointer flex justify-between items-center group perspective-card';
                subCard.innerHTML = `<div><h4 class="font-black text-lg text-white group-hover:text-indigo-400 transition">${sub.title}</h4><p class="text-xs text-slate-500 font-bold">${sub.desc}</p></div><i class="fas fa-chevron-right text-slate-700 group-hover:translate-x-2 transition"></i>`;
                subCard.onclick = () => selectSub(id, sub.id, sub);
                subList.appendChild(subCard);
            });
            document.getElementById('node-1').classList.add('active');
            window.scrollTo({ top: subSec.offsetTop - 120, behavior: 'smooth' });
        }

        function selectSub(mId, sId, subData) {
            document.getElementById('main-chart-display').src = subData.img;
            document.getElementById('chart-tag').innerText = `Scenario ${sId}`;
            const sec = document.getElementById('sec-strategy');
            const area = document.getElementById('strategy-area');
            sec.classList.remove('hidden');
            area.innerHTML = `
                <div class="glass-panel p-6 mb-8 bg-slate-800/80">
                    <h4 class="text-[10px] font-black text-emerald-400 mb-3 uppercase tracking-widest italic">Technical Logic Detail</h4>
                    <p class="text-sm text-slate-300 leading-relaxed font-bold">${subData.logic}</p>
                </div>
            `;
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 gap-4';
            masterData.strategy[sId].forEach(item => {
                const isInv = item.label === 'Invalidation';
                grid.innerHTML += `<div class="glass-panel p-5 ${isInv?'border-rose-500/30 bg-rose-500/5':''}">
                    <span class="text-[8px] font-black text-slate-500 uppercase block mb-1">${item.label}</span>
                    <div class="text-xl font-black text-white italic mb-1">${item.val}</div>
                    <p class="text-[9px] text-slate-500 font-bold">${item.note}</p>
                    ${isInv?`<button onclick="jumpToAlternative()" class="mt-4 w-full bg-rose-500 text-white py-2 rounded-xl text-[9px] font-black">관점 대안 시나리오 로드 <i class="fas fa-bolt ml-1"></i></button>`:''}
                </div>`;
            });
            area.appendChild(grid);
            area.innerHTML += `<div class="bg-indigo-600 p-10 rounded-[2.5rem] shadow-2xl text-center"><span class="text-[10px] font-black text-indigo-200 uppercase tracking-widest block mb-4 italic">Analyst Conclusion</span><p class="text-lg font-black text-white leading-relaxed">${subData.review}</p></div>`;
            document.getElementById('node-3').classList.add('active');
            window.scrollTo({ top: sec.offsetTop - 120, behavior: 'smooth' });
        }

        function toggleNote(id, btn) {
            const note = document.getElementById(id);
            const isExp = note.classList.toggle('expanded');
            btn.innerHTML = isExp ? `Hide Deep Dive <i class="fas fa-chevron-up"></i>` : `Review Deep Dive <i class="fas fa-chevron-down"></i>`;
        }

        function jumpToAlternative() { alert("무효화 지점 도달 시 리스크 관리를 위해 즉시 관점 B로 스위칭합니다."); document.querySelectorAll('#macro-list .glass-panel')[1].click(); }

        window.onload = () => { renderFeedback(); renderMacros(); };
    </script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileNav = document.getElementById('mobile-nav');
        if (menuToggle && mobileNav) {
            const menuIcon = menuToggle.querySelector('i');
            menuToggle.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                if (mobileNav.classList.contains('active')) {
                    menuIcon.classList.replace('fa-bars', 'fa-times');
                } else {
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                }
            });
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                });
            });
        }
    </script>
</body>
</html>
