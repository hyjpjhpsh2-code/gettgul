<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GETGGUL BUILDER V21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            padding-bottom: 120px;
        }

        #canvas {
            background: white;
            color: #1e293b;
            min-height: 100vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .view-grid {
            display: flex;
            gap: 1.5rem;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .view-grid::-webkit-scrollbar {
            height: 8px;
        }

        .view-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .view-card {
            flex: 0 0 calc(33.333% - 1rem);
            min-width: 320px;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 1023px) {
            .view-card {
                flex: 0 0 85vw;
                min-width: 85vw;
                scroll-snap-align: center;
            }
        }

        .block-wrapper {
            position: relative;
            border: 2px solid transparent;
            transition: 0.2s;
            padding: 10px;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }

        .block-wrapper:hover {
            border-color: #e2e8f0;
            background: #f8fafc;
        }

        .block-wrapper.is-active {
            border-color: #818cf8 !important;
            background: #f8fafc;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
            z-index: 10;
        }

        .controls {
            position: absolute;
            top: -18px;
            left: 16px;
            z-index: 60;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            transform: translateY(4px);
        }

        .block-wrapper:hover>.controls,
        .block-wrapper.is-active>.controls {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        .sortable-ghost {
            opacity: 0.3;
            background: #e2e8f0;
            border: 2px dashed #818cf8 !important;
            border-radius: 1rem;
        }

        .sortable-chosen {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }

        .sortable-drag {
            cursor: grabbing !important;
        }

        .drag-handle {
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        [contenteditable="true"] img {
            max-width: 100%;
            height: auto;
            border-radius: 1rem;
            margin: 1.5rem 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: zoom-in;
        }

        [contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 1.5rem;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: #f8fafc;
        }

        .drop-zone.active {
            border-color: #6366f1;
            background: #e0e7ff;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .re-upload-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            display: none;
            cursor: pointer;
            z-index: 20;
        }

        .drop-zone:hover .re-upload-btn {
            display: block;
        }

        .badge {
            font-size: 11px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 99px;
            display: inline-block;
        }

        .badge-유지 {
            background: #10b981;
            color: white;
        }

        .badge-폐기 {
            background: #ef4444;
            color: white;
        }

        .badge-신규 {
            background: #3b82f6;
            color: white;
        }

        .badge-무표기 {
            display: none;
        }

        .inner-blocks-area {
            transition: 0.3s;
        }

        .inner-blocks-area:empty {
            display: none;
            border: none;
        }

        /* 다크 테마 에디터용 CSS */
        .theme-dark .block-wrapper:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .theme-dark .block-wrapper.is-active {
            background: rgba(255, 255, 255, 0.05);
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .theme-dark .view-card {
            background-color: #1e293b;
            border-color: #334155;
            color: #f8fafc;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .theme-dark .view-card h3 {
            color: #f8fafc;
        }

        .theme-dark .view-card div[contenteditable] {
            color: #94a3b8;
        }

        .theme-dark .view-card .bg-slate-100 {
            background-color: #334155;
            color: #cbd5e1;
        }

        .theme-dark .status-select {
            background-color: #0f172a;
            border-color: #475569;
            color: #f8fafc;
        }

        .theme-dark .status-select:hover {
            background-color: #1e293b;
        }

        .theme-dark .drop-zone {
            background-color: #0f172a;
            border-color: #334155;
        }

        .theme-dark .drop-zone.active {
            background-color: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        .theme-dark .upload-placeholder {
            color: #475569;
        }

        .theme-dark .upload-placeholder i {
            color: #4f46e5;
        }

        .theme-dark .chart-container .drop-zone {
            background-color: #1e293b;
            border-color: #4f46e5;
        }

        .theme-dark .text-slate-700 {
            color: #cbd5e1;
        }

        .theme-dark .hover\\:bg-slate-50:hover {
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        #editor-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
            backdrop-filter: blur(5px);
        }

        #editor-modal img {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }
    
        /* index.html 100% 모바일 메뉴 애니메이션 및 스타일 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6e5ce6;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .nav-item {
                color: #1a202c !important;
            }
        }
    
        /* v3 메인(v3/index.html) 100% 모바일 메뉴 애니메이션 및 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6366f1;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>

<body>

    <div id="editor-modal" onclick="closeModal()">
        <img id="editor-modal-img" src="" alt="확대된 이미지">
    </div>

    <!-- JSON 추출 모달 -->
    <div id="json-modal"
        class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[9999] hidden flex-col items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-2xl shadow-2xl relative">
            <button onclick="document.getElementById('json-modal').style.display='none'"
                class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-black text-white mb-2"><i class="fas fa-code text-indigo-400 mr-2"></i>JSON 데이터 추출
                완료</h3>
            <p class="text-sm text-slate-400 mb-4">아래 코드를 복사하여 <code
                    class="bg-slate-900 px-1 py-0.5 rounded text-indigo-300">posts.json</code> 파일의 최상단 <code>[</code> 바로
                아래에 붙여넣으세요.</p>
            <textarea id="json-output"
                class="w-full h-56 bg-slate-900 text-emerald-400 p-4 rounded-xl font-mono text-sm border border-slate-700 focus:border-indigo-500 outline-none resize-none shadow-inner"
                readonly></textarea>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="copyJson()"
                    class="px-6 py-3 rounded-xl font-black bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-500/20 w-full md:w-auto flex justify-center items-center">
                    <i class="far fa-copy mr-2"></i>코드 복사하기
                </button>
            </div>
        </div>
    </div>

    <div id="tag-modal" class="absolute z-[10000] hidden transition-opacity duration-200 opacity-0">
        <div class="bg-slate-800/95 backdrop-blur-xl border border-slate-600 rounded-2xl w-[340px] p-5 shadow-[0_15px_50px_-12px_rgba(0,0,0,0.7)] relative">
            <div class="absolute -top-2 left-6 w-4 h-4 bg-slate-800 border-t border-l border-slate-600 transform rotate-45"></div>

            <h3 class="text-base font-black text-white mb-4 flex items-center gap-2">
                <i class="fas fa-tag text-emerald-400"></i> 이론 태그 연결
            </h3>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 mb-1.5 block uppercase tracking-wider">1. 대분류 (세부 파동 선택)</label>
                    <select id="step1" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm p-2.5 rounded-lg outline-none focus:border-emerald-500 transition-colors cursor-pointer"></select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 mb-1.5 block uppercase tracking-wider">2. 소분류 (1~5번 세부 항목)</label>
                    <select id="step2" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm p-2.5 rounded-lg outline-none focus:border-emerald-500 transition-colors cursor-pointer" disabled></select>
                </div>
            </div>

            <div class="mt-6 flex gap-2">
                <button onclick="closeTagModal()" class="flex-1 py-2.5 bg-slate-700 text-slate-300 rounded-lg text-sm font-bold hover:bg-slate-600 hover:text-white transition-colors">취소</button>
                <button onclick="applyTag()" class="flex-1 py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-black hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-500/20">태그 적용</button>
            </div>
        </div>
    </div>

    <nav
        class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-[100] border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="font-black italic text-xl text-indigo-400">GETGGUL BUILDER</span>
            <span class="bg-indigo-500/20 text-indigo-400 text-[10px] font-black px-2 py-0.5 rounded">V21.0</span>
        </div>
        <!-- 태그 삽입 버튼 포함 -->
        <div class="flex items-center gap-2">
            <button onclick="document.getElementById('draft-input').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white px-3 py-2.5 rounded-xl font-bold text-sm transition flex items-center" title="초안 불러오기">
                <i class="fas fa-folder-open"></i>
            </button>
            <button onclick="saveDraftToFile()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white px-3 py-2.5 rounded-xl font-bold text-sm transition flex items-center" title="초안 저장하기">
                <i class="fas fa-save"></i>
            </button>
            <div class="w-px h-6 bg-slate-600 mx-1"></div>
            <button onclick="openTagModal()"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 md:px-5 py-2.5 rounded-xl font-black text-sm transition shadow-lg flex items-center">
                <i class="fas fa-tags md:mr-2"></i><span class="hidden md:inline">태그 삽입</span>
            </button>
            <button onclick="processReport('preview')"
                class="bg-slate-700 hover:bg-slate-600 text-white px-4 md:px-5 py-2.5 rounded-xl font-black text-sm transition shadow-lg flex items-center">
                <i class="fas fa-eye md:mr-2"></i><span class="hidden md:inline">미리보기</span>
            </button>
            <button onclick="processReport('download')"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 md:px-6 py-2.5 rounded-xl font-black text-sm transition shadow-lg shadow-indigo-500/20 flex items-center">
                <i class="fas fa-rocket md:mr-2"></i><span class="hidden md:inline">최종 리포트 발행</span><span
                    class="md:hidden">발행</span>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10" id="canvas-container">
        <div id="canvas" class="p-6 md:p-16 rounded-[3rem]">
            <div class="text-center mb-16 relative group">
                <h1 contenteditable="true" id="report-title"
                    class="text-4xl md:text-6xl font-black tracking-tighter text-slate-900 mb-4 outline-none border-b-2 border-transparent focus:border-indigo-200 transition">
                    분석 리포트 제목</h1>
                <p contenteditable="true" id="report-date" class="text-slate-400 font-bold outline-none">2026.03.24 |
                    GETGGUL MASTER ANALYSIS</p>
            </div>

            <div id="blocks-area" class="space-y-4">
                <div class="block-wrapper group">
                    <div
                        class="controls bg-slate-800/95 backdrop-blur-md p-1 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] border border-slate-700/50 flex items-center no-export">
                        <div
                            class="drag-handle text-slate-400 hover:text-white px-2 py-1 cursor-grab active:cursor-grabbing">
                            <i class="fas fa-grip-vertical"></i></div>
                        <div class="w-px h-4 bg-slate-600 mx-1"></div>
                        <button onclick="changeLevel(this, -1)"
                            class="text-slate-300 hover:text-indigo-400 w-7 h-7 rounded-lg hover:bg-slate-700 transition tooltip flex justify-center items-center"
                            title="상위 레벨로 (내어쓰기)"><i class="fas fa-outdent text-[11px]"></i></button>
                        <button onclick="changeLevel(this, 1)"
                            class="text-slate-300 hover:text-indigo-400 w-7 h-7 rounded-lg hover:bg-slate-700 transition tooltip flex justify-center items-center"
                            title="하위 레벨로 (들여쓰기)"><i class="fas fa-indent text-[11px]"></i></button>
                        <div class="w-px h-4 bg-slate-600 mx-1"></div>
                        <button onclick="moveBlock(this, -1)"
                            class="text-slate-300 hover:text-indigo-400 w-7 h-7 rounded-lg hover:bg-slate-700 transition tooltip flex justify-center items-center"
                            title="위로"><i class="fas fa-arrow-up text-[11px]"></i></button>
                        <button onclick="moveBlock(this, 1)"
                            class="text-slate-300 hover:text-indigo-400 w-7 h-7 rounded-lg hover:bg-slate-700 transition tooltip flex justify-center items-center"
                            title="아래로"><i class="fas fa-arrow-down text-[11px]"></i></button>
                        <div class="w-px h-4 bg-slate-600 mx-1"></div>
                        <button onclick="this.closest('.block-wrapper').remove()"
                            class="text-rose-400 hover:text-rose-300 hover:bg-rose-500/20 w-7 h-7 rounded-lg transition tooltip flex justify-center items-center"
                            title="삭제"><i class="fas fa-trash text-[11px]"></i></button>
                    </div>
                    <div class="block-content w-full">
                        <div contenteditable="true"
                            class="text-xl leading-loose text-slate-700 font-medium min-h-[50px] outline-none my-4 p-4 hover:bg-slate-50 rounded-2xl transition"
                            placeholder="이곳에 분석 배경이나 서론을 자유롭게 작성하세요. 이미지를 복사(Ctrl+C)해서 이곳에 바로 붙여넣기(Ctrl+V) 할 수도 있습니다.">
                        </div>
                        <div class="inner-blocks-area space-y-4 mt-4 ml-4 md:ml-8 border-l-2 border-slate-200 pl-4">
                        </div>
                        <div
                            class="add-inner flex justify-center mt-3 opacity-0 group-hover:opacity-100 transition no-export">
                            <div class="bg-white border border-slate-200 rounded-full shadow-sm p-1.5 flex gap-1 z-10">
                                <button
                                    onclick="createBlock('section', this.closest('.block-wrapper').querySelector('.inner-blocks-area'))"
                                    class="px-3 py-1 text-[11px] font-bold hover:bg-slate-100 rounded-full text-slate-600 transition">+
                                    일반카드</button>
                                <button
                                    onclick="createBlock('grid', this.closest('.block-wrapper').querySelector('.inner-blocks-area'))"
                                    class="px-3 py-1 text-[11px] font-bold hover:bg-slate-100 rounded-full text-slate-600 transition">+
                                    관점카드</button>
                                <button
                                    onclick="createBlock('text', this.closest('.block-wrapper').querySelector('.inner-blocks-area'))"
                                    class="px-3 py-1 text-[11px] font-bold hover:bg-slate-100 rounded-full text-slate-600 transition">+
                                    텍스트</button>
                                <button
                                    onclick="createBlock('chart', this.closest('.block-wrapper').querySelector('.inner-blocks-area'))"
                                    class="px-3 py-1 text-[11px] font-bold hover:bg-slate-100 rounded-full text-slate-600 transition">+
                                    대형차트</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-xl border border-white/10 p-3 rounded-[2.5rem] shadow-2xl flex gap-2 z-[100]">
        <button onclick="addBlockFromToolbar('section')"
            class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-500 text-white px-5 py-3 rounded-full text-xs font-black transition"><i
                class="fas fa-heading"></i> 일반카드(섹션)</button>
        <button onclick="addBlockFromToolbar('grid')"
            class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-500 text-white px-5 py-3 rounded-full text-xs font-black transition"><i
                class="fas fa-columns"></i> 관점카드(그리드)</button>
        <button onclick="addBlockFromToolbar('text')"
            class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-500 text-white px-5 py-3 rounded-full text-xs font-black transition"><i
                class="fas fa-align-left"></i> 텍스트/차트 혼합</button>
        <button onclick="addBlockFromToolbar('chart')"
            class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-500 text-white px-5 py-3 rounded-full text-xs font-black transition"><i
                class="fas fa-image"></i> 대형 차트</button>
    </div>

    <input type="file" id="file-input" class="hidden" accept="image/*">
    <input type="file" id="draft-input" class="hidden" accept=".json">

    <script src="theory_data.js"></script>

    <script>
        // --- 4단 캐스케이딩 로직 ---
        // --- 직관적 2단계 캐스케이딩 로직 ---
        let selectedRange = null;

        function openTagModal() {
            const selection = window.getSelection();
            if (selection.rangeCount === 0 || selection.toString().trim() === "") {
                alert("태그를 걸 단어를 먼저 드래그하여 선택해주세요.");
                return;
            }
            if (typeof theoryDB === 'undefined') {
                alert("이론 데이터(theory_data.js)를 불러오지 못했습니다.");
                return;
            }

            selectedRange = selection.getRangeAt(0);
            const rect = selectedRange.getBoundingClientRect();
            const tagModal = document.getElementById('tag-modal');

            let topPos = rect.bottom + window.scrollY + 10;
            let leftPos = rect.left + window.scrollX - 20;

            if (leftPos + 340 > window.innerWidth) {
                leftPos = window.innerWidth - 360;
            }

            tagModal.style.top = `${topPos}px`;
            tagModal.style.left = `${leftPos}px`;
            tagModal.style.display = 'block';

            setTimeout(() => { tagModal.classList.remove('opacity-0'); }, 10);

            initStep1();
        }

        function closeTagModal() {
            const tagModal = document.getElementById('tag-modal');
            tagModal.classList.add('opacity-0');
            setTimeout(() => {
                tagModal.style.display = 'none';
            }, 200);
        }

        function initStep1() {
            const s1 = document.getElementById('step1');
            s1.innerHTML = '<option value="">선택하세요</option>';

            // 1단계: 동인파, 조정파 등으로 그룹핑하고 그 안에 임펄스, 지그재그 등을 넣음
            Object.keys(theoryDB).forEach(catKey => {
                const category = theoryDB[catKey];
                const optgroup = document.createElement('optgroup');
                optgroup.label = `━━ ${category.name} ━━`;

                Object.keys(category.waves).forEach(waveKey => {
                    const wave = category.waves[waveKey];
                    const option = document.createElement('option');
                    // 나중에 2단계 조회를 위해 카테고리키와 파동키를 같이 저장
                    option.value = `${catKey}.${waveKey}`; 
                    option.textContent = wave.name;
                    optgroup.appendChild(option);
                });
                s1.appendChild(optgroup);
            });

            s1.onchange = (e) => initStep2(e.target.value);

            // 2단계 초기화
            const s2 = document.getElementById('step2');
            s2.innerHTML = '<option value="">세부 파동을 먼저 선택하세요</option>';
            s2.disabled = true;
        }

        function initStep2(selectedWave) {
            const s2 = document.getElementById('step2');
            s2.innerHTML = '<option value="">선택하세요</option>';

            if (!selectedWave) { 
                s2.disabled = true; 
                s2.innerHTML = '<option value="">세부 파동을 먼저 선택하세요</option>';
                return; 
            }

            s2.disabled = false;
            const [catKey, waveKey] = selectedWave.split('.');
            const types = theoryDB[catKey].waves[waveKey].types;

            // 2단계: 선택된 파동 안의 1~5번 항목을 쫙 뿌려줌
            Object.keys(types).forEach(typeKey => {
                const typeObj = types[typeKey];
                
                // 보기 좋게 [개념 및 특징], [규칙 및 매매] 등으로 그룹핑
                const optgroup = document.createElement('optgroup');
                optgroup.label = `[ ${typeObj.name} ]`;

                const items = typeObj.items;
                Object.keys(items).forEach(itemKey => {
                    const item = items[itemKey];
                    const option = document.createElement('option');
                    // 최종 태그 ID는 4단계 경로를 모두 포함해야 하므로 조합해서 value 지정
                    option.value = `${catKey}.${waveKey}.${typeKey}.${itemKey}`;
                    option.textContent = item.title; // "1. 차트를 포함한 개념 설명" 등
                    optgroup.appendChild(option);
                });
                s2.appendChild(optgroup);
            });
        }

        function applyTag() {
            // 2단계에서 선택된 값이 완벽한 theoryId 조합임
            const theoryId = document.getElementById('step2').value;

            if (!theoryId) {
                alert("1~5번 세부 항목을 선택해야 적용할 수 있습니다.");
                return;
            }

            const span = document.createElement('span');
            span.className = "text-indigo-400 border-b-2 border-indigo-400 border-dashed font-bold cursor-pointer mx-1 theory-tag hover:bg-indigo-500/10 transition-colors px-1 py-0.5 rounded";
            span.dataset.theoryId = theoryId;
            span.setAttribute("onclick", `if(typeof openTermModal !== 'undefined') openTermModal('${theoryId}')`);
            span.textContent = selectedRange.toString();

            selectedRange.deleteContents();
            selectedRange.insertNode(span);

            // 태그 삽입 후 커서를 span 밖으로 빼기
            const zws = document.createTextNode('\u200B');
            span.parentNode.insertBefore(zws, span.nextSibling);

            const selection = window.getSelection();
            selection.removeAllRanges();
            const newRange = document.createRange();
            newRange.setStartAfter(zws);
            newRange.collapse(true);
            selection.addRange(newRange);

            closeTagModal();
        }

        function initSortable(el) {
            new Sortable(el, { group: 'nested', animation: 150, fallbackOnBody: true, swapThreshold: 0.65, handle: '.drag-handle', ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', dragClass: 'sortable-drag' });
        }

                const today = new Date();

                const month = String(today.getMonth() + 1).padStart(2, '0'); 
                const day = String(today.getDate()).padStart(2, '0');
                dateElement.innerText = `${year}.${month}.${day} | GETGGUL 비트코인 차트분석`;

        function changeLevel(btn, direction) {
            const wrapper = btn.closest('.block-wrapper');
            if (direction === 1) {
                const prevSibling = wrapper.previousElementSibling;
                if (prevSibling && prevSibling.classList.contains('block-wrapper')) {
                    const targetInner = prevSibling.querySelector('.inner-blocks-area');
                    if (targetInner) { targetInner.appendChild(wrapper); updateActiveBlock(wrapper); }
                } else { alert('바로 위에 다른 카드가 있어야 하위 단계로 들어갈 수 있습니다.'); }
            } else if (direction === -1) {
                const currentInnerArea = wrapper.parentElement;
                if (currentInnerArea && currentInnerArea.classList.contains('inner-blocks-area')) {
                    const parentWrapper = currentInnerArea.closest('.block-wrapper');
                    if (parentWrapper) { parentWrapper.parentElement.insertBefore(wrapper, parentWrapper.nextElementSibling); updateActiveBlock(wrapper); }
                } else { alert('이미 최상위 단계입니다.'); }
            }
        }

        function moveBlock(btn, direction) {
            const wrapper = btn.closest('.block-wrapper');
            const parent = wrapper.parentNode;
            if (direction === -1 && wrapper.previousElementSibling) parent.insertBefore(wrapper, wrapper.previousElementSibling);
            else if (direction === 1 && wrapper.nextElementSibling) parent.insertBefore(wrapper.nextElementSibling, wrapper);
        }

        function openModal(src) {
            if (!src) return;
            const modalImg = document.getElementById('editor-modal-img');
            modalImg.src = src;
            document.getElementById('editor-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editor-modal').style.display = 'none'; }

        document.getElementById('blocks-area').addEventListener('click', function (e) {
            if (e.target.tagName === 'IMG' && e.target.closest('[contenteditable="true"]')) openModal(e.target.src);
        });

        function triggerFile(el, event) { if (event) event.stopPropagation(); targetDropZone = el; document.getElementById('file-input').click(); }

        document.getElementById('file-input').onchange = function (e) {
            if (e.target.files && e.target.files[0]) handleFile(e.target.files[0], targetDropZone);
            this.value = '';
        };

        function setupDragAndDrop(wrapper) {
            const zones = wrapper.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('active'); });
                zone.addEventListener('dragleave', () => zone.classList.remove('active'));
                zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('active'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], zone); });
            });
        }

        function handleFile(file, zone) {
            if (!file.type.startsWith('image/')) { alert('이미지 파일만 업로드 가능합니다.'); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = zone.querySelector('.preview-img');
                const placeholder = zone.querySelector('.upload-placeholder');
                const zoomOverlay = zone.querySelector('.zoom-overlay');
                img.src = e.target.result; img.classList.remove('hidden');
                if (placeholder) placeholder.classList.add('hidden');
                if (zoomOverlay) zoomOverlay.classList.remove('hidden');
                if (zone.classList.contains('min-h-[300px]')) {
                    zone.classList.remove('border-2', 'border-dashed', 'min-h-[300px]', 'md:min-h-[500px]');
                    img.classList.remove('h-full', 'object-cover'); img.classList.add('h-auto');
                }
            };
            reader.readAsDataURL(file);
        }

        function setupPasteEvent(wrapper) {
            const editables = wrapper.querySelectorAll('[contenteditable="true"]');
            editables.forEach(editable => {
                editable.addEventListener('paste', (e) => {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let index in items) {
                        const item = items[index];
                        if (item.kind === 'file' && item.type.startsWith('image/')) {
                            e.preventDefault();

            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            alert("초안 파일이 다운로드 폴더에 저장되었습니다!");
        }

        // 2. 초안 불러오기 (파일 업로드)
        document.getElementById('draft-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const draftData = JSON.parse(event.target.result);
                    
                    if(!draftData.blocks) {
                        alert("올바른 초안 파일이 아닙니다.");
                        return;
                    }

                    if(confirm("기존에 작성 중이던 내용은 모두 사라집니다. 초안을 불러오시겠습니까?")) {
                        // 내용 복구
                        document.getElementById('report-title').innerHTML = draftData.title;
                        document.getElementById('report-date').innerHTML = draftData.date;
                        document.getElementById('blocks-area').innerHTML = draftData.blocks;

                        // ★핵심★ 새로 끼워넣은 HTML 요소들에 자바스크립트 이벤트(드래그앤드롭 등) 다시 달아주기
                        reinitializeEditorEvents();
                        alert("초안을 성공적으로 불러왔습니다!");
                    }
                } catch (error) {
                    alert("파일을 읽는 중 오류가 발생했습니다.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
            
            // 같은 파일을 다시 선택해도 작동하도록 input 초기화
            this.value = '';
        });

        // 3. 불러온 블록들에 이벤트 다시 생명 불어넣기
        function reinitializeEditorEvents() {
            // Sortable 재활성화
            initSortable(document.getElementById('blocks-area'));
            document.querySelectorAll('.inner-blocks-area').forEach(initSortable);

            // 각 블록들 드래그앤드롭 및 페이스트 이벤트 재활성화
            document.querySelectorAll('.block-wrapper').forEach(wrapper => {
                setupDragAndDrop(wrapper);
                setupPasteEvent(wrapper);
            });
        }
    </script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileNav = document.getElementById('mobile-nav');
        if (menuToggle && mobileNav) {
            const menuIcon = menuToggle.querySelector('i');
            menuToggle.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                if (mobileNav.classList.contains('active')) {
                    menuIcon.classList.replace('fa-bars', 'fa-times');
                } else {
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                }
            });
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                });
            });
        }
    </script>
</body>

</html>
