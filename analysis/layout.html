<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GETGGUL 비트코인 분석 | 마스터 전략 트리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; word-break: keep-all; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* [1. PC 레이아웃: 가로스크롤 제거 및 그리드 배치] */
        .card-container { display: flex; gap: 1.5rem; }
        @media (min-width: 1024px) {
            .card-container { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 2rem; overflow: visible !important; }
            .setup-grid-pc { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
            .perspective-card { width: 100% !important; min-width: 0 !important; }
            .scroll-arrow { display: none !important; }
        }
        @media (max-width: 1023px) {
            .card-container { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 1.5rem; }
            .perspective-card { min-width: 280px; width: 85vw; flex-shrink: 0; }
        }

        /* [2. 애니메이션 로직 수정: 붙여쓰기(.is-visible.reveal-item)로 투명도 해결] */
        @keyframes revealUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .reveal-item { opacity: 0; }
        .reveal-item.is-visible { animation: revealUp 0.6s ease-out forwards; } /* 공백 제거 */

        /* [3. UI 디자인 요소] */
        .perspective-card { background: white; border-radius: 2.5rem; border: 2px solid #e2e8f0; position: relative; overflow: hidden; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .perspective-card.active { border-color: #4f46e5; box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.25); transform: scale(1.03); z-index: 10; opacity: 1 !important; }
        .card-container.has-active .perspective-card:not(.active) { opacity: 0.3 !important; transform: scale(0.97); }

        .id-badge { position: absolute; top: -2px; left: -2px; background: #1e293b; color: white; width: 52px; height: 42px; border-radius: 2rem 0 1.5rem 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; z-index: 20; border: 2px solid #4f46e5; }
        .status-badge { position: absolute; top: 1.5rem; right: 1.5rem; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 900; z-index: 10; }
        .status-maintained { background: #ecfdf5; color: #059669; border: 1px solid #10b981; }
        .status-discarded { background: #fef2f2; color: #dc2626; border: 1px solid #ef4444; }
        
        .img-frame { width: 100%; height: 240px; background: #000; display: flex; justify-content: center; overflow: hidden; border-radius: 1.5rem; position: relative; }
        .fit-img { max-width: 100%; max-height: inherit; object-fit: contain; }
        .zoom-btn { position: absolute; bottom: 1rem; right: 1rem; background: rgba(51, 65, 85, 0.7); color: white; padding: 0.65rem; border-radius: 9999px; backdrop-filter: blur(4px); z-index: 20; }

        /* [4. 최종 총평 스타일] */
        #final-review-section { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 3rem; padding: 4rem 2rem; margin: 5rem auto; max-width: 1200px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .review-content { color: #f8fafc; font-size: 1.5rem; font-weight: 800; line-height: 1.7; word-break: keep-all; }

        #floating-bar { position: fixed; bottom: -120px; left: 0; right: 0; padding: 25px; z-index: 100; transition: 0.5s; }
        #floating-bar.show { bottom: 0; }
        #zoom-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
        #zoom-modal.show { display: flex; }
    
        /* index.html 100% 모바일 메뉴 애니메이션 및 스타일 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6e5ce6;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .nav-item {
                color: #1a202c !important;
            }
        }
    
        /* v3 메인(v3/index.html) 100% 모바일 메뉴 애니메이션 및 동기화 */
        @media (max-width: 768px) {
            #mobile-nav.active {
                display: block !important;
                animation: slideDown 0.3s ease-out;
                border-bottom: 2px solid #6366f1;
            }
            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>

        function renderFeedback() {
            const container = document.getElementById('feedback-container');
            masterData.feedback.forEach(item => {
                const isMaintained = item.status === 'maintained';
                const card = document.createElement('div');
                card.className = 'perspective-card p-6 border-slate-200';
                card.innerHTML = `
                    <div class="id-badge bg-slate-400 border-none font-black">${item.id}</div>
                    <div class="status-badge ${isMaintained ? 'status-maintained' : 'status-discarded'}">
                        ${isMaintained ? '<i class="fas fa-check-circle mr-1"></i> 관점 유지' : '<i class="fas fa-times-circle mr-1"></i> 관점 폐기'}
                    </div>
                    <div class="text-[10px] font-black text-slate-400 mb-2 uppercase">${item.date}</div>
                    <div class="img-frame mb-4 h-[160px] grayscale-[0.6] opacity-70"><img src="${item.img}" class="fit-img"></div>
                    <h4 class="font-black text-slate-800 mb-1">${item.title}</h4>
                    <p class="text-[11px] text-slate-500 font-bold mb-3">${item.desc}</p>
                    ${!isMaintained ? `<div class="bg-red-50 p-3 rounded-xl border border-red-100"><p class="text-[10px] text-red-600 font-black leading-tight">폐기근거: ${item.reason}</p></div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        let currentMacroId = null;
        function selectMacro(id, el) {
            currentMacroId = id; document.getElementById('macro-container').classList.add('has-active');
            document.querySelectorAll('#macro-container .perspective-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active'); document.getElementById('macro-id-text').innerText = id;
            document.getElementById('sub-section').classList.add('hidden'); document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('floating-bar').classList.add('show');
        }

        function handleViewDetails() {
            const section = document.getElementById('sub-section'); const scroller = document.getElementById('sub-scroller');
            section.classList.remove('hidden'); scroller.innerHTML = '';
            window.scrollTo({ top: section.offsetTop - 80, behavior: 'smooth' });
            setTimeout(() => {
                masterData[currentMacroId].subs.forEach((sub, index) => {
                    const card = document.createElement('div'); card.className = 'perspective-card p-6 reveal-item is-visible';
                    card.style.animationDelay = (index * 0.15) + 's';
                    card.onclick = () => selectSub(sub.id, card);
                    card.innerHTML = `<div class="id-badge">${sub.id}</div><div class="img-frame mb-6 mt-6"><img src="${sub.img}" class="fit-img"><button onclick="openModal(this)" class="zoom-btn"><i class="fas fa-expand-alt"></i></button></div><h3 class="text-xl font-black mb-2 italic text-center">${sub.title}</h3><p class="text-[11px] text-slate-500 font-bold mb-4 text-center">${sub.desc}</p><div class="strategy-btn-area"></div>`;
                    scroller.appendChild(card);
                });
                section.classList.add('is-visible');
            }, 450);
        }

        function selectSub(sId, el) {
            document.getElementById('sub-scroller').classList.add('has-active');
            document.querySelectorAll('#sub-scroller .perspective-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.strategy-btn-area').forEach(area => area.innerHTML = '');
            const btnArea = el.querySelector('.strategy-btn-area');
            const btn = document.createElement('button');
            btn.className = `w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm shadow-xl mt-4 active:scale-95 transition-transform`;
            btn.innerHTML = `상세 투자전략 보기 <i class="fas fa-bolt"></i>`;
            btn.onclick = (e) => { e.stopPropagation(); handleViewStrategy(sId); };
            btnArea.appendChild(btn);
        }

        function handleViewStrategy(sId) {
            const section = document.getElementById('setup-section'); const grid = document.getElementById('setup-grid');
            section.classList.remove('hidden'); grid.innerHTML = '';
            window.scrollTo({ top: section.offsetTop - 80, behavior: 'smooth' });
            setTimeout(() => {
                const subData = masterData[currentMacroId].subs.find(s => s.id === sId);
                const setupData = masterData[currentMacroId].setup[sId];
                if(setupData) {
                    setupData.forEach((item, index) => {
                        const card = document.createElement('div'); card.className = 'bg-white rounded-[2.5rem] p-8 border-2 border-slate-100 shadow-sm relative group reveal-item is-visible';
                        card.style.animationDelay = (index * 0.12) + 's';
                        card.innerHTML = `<div class="id-badge bg-emerald-600 w-auto px-4 border-none text-[12px]">${item.label}</div><div class="img-frame mb-6 mt-6"><img src="${item.img}" class="fit-img"><button onclick="openModal(this)" class="zoom-btn opacity-0 group-hover:opacity-100"><i class="fas fa-expand-alt"></i></button></div><p class="text-2xl font-black text-slate-900 mb-2 italic">${item.desc}</p><p class="text-xs text-slate-400 font-bold italic">${item.note}</p>`;
                        grid.appendChild(card);
                    });
                    document.getElementById('final-review-text').innerText = subData.review;
                    section.classList.add('is-visible');
                    document.getElementById('final-review-section').classList.remove('hidden');
                    setTimeout(() => document.getElementById('final-review-section').classList.add('is-visible'), 300);
                }
            }, 450);
        }

        function openModal(btn) {
            const card = btn.closest('.perspective-card') || btn.closest('.group');
            document.getElementById('modal-img').src = card.querySelector('img').src;
            document.getElementById('zoom-modal').classList.add('show');
        }

        window.onload = renderFeedback;
    </script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileNav = document.getElementById('mobile-nav');
        if (menuToggle && mobileNav) {
            const menuIcon = menuToggle.querySelector('i');
            menuToggle.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                if (mobileNav.classList.contains('active')) {
                    menuIcon.classList.replace('fa-bars', 'fa-times');
                } else {
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                }
            });
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                });
            });
        }
    </script>
</body>
</html>
