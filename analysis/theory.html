    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const dropdown = document.getElementById('mobile-dropdown');
            if (menuBtn && dropdown) {
                menuBtn.addEventListener('click', () => {
                    dropdown.classList.toggle('hidden');
                    const icon = menuBtn.querySelector('i');
                    if (dropdown.classList.contains('hidden')) {
                        icon.classList.remove('fa-times'); icon.classList.add('fa-bars');
                    } else {
                        icon.classList.remove('fa-bars'); icon.classList.add('fa-times');
                    }
                });
            }
            initTheoryPage();
        });

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const toggleBtn = document.getElementById('toc-toggle-btn');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            toggleBtn.classList.add('opacity-0', 'pointer-events-none', '-translate-x-full');
        }

        function closeSidebar() {
            if (window.innerWidth >= 768) return;
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
            toggleBtn.classList.remove('opacity-0', 'pointer-events-none', '-translate-x-full');
        }

        function scrollToTop() {
            const mainContent = document.getElementById('main-content');
            if (mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });

                        <p class="text-sm">theory_data.js 파일을 찾을 수 없습니다.</p>
                    </div>
                `;
                return;
            }
            renderSidebar();
            renderIntro();
        }

                    </div>
                </div>
                <div class="flex flex-col gap-1 w-full">

                            ${waveData.name}

                }
            }
            html += `</div>`;
            menuContainer.innerHTML = html;

                        </h3>
                        <p class="text-slate-300 leading-loose text-sm md:text-base mb-8 max-w-2xl mx-auto relative z-10">
                            이제 파동 분석의 본질을 이해하셨다면, 좌측 메뉴에서 어떤 파동들이 있고 그 특징은 무엇인지, 해당 파동이 나왔을때의 포지션 진입 타점은 어떻게 잡는지 학습하시길 바랍니다. 기초적인 학습이 되었다면 우측 상단에 '목록' 버튼을 통해 매일 업로드되는 GETGGUL의 실제 차트 분석 리포트를 더 효과적으로 활용할 차례입니다.<br><br>
                            중요한 것은 맹목적인 추종이 아닙니다. GETGGUL의 분석을 참고하되, 본인의 관점과 <strong>교차 검증</strong>하며 왜 이 자리가 중요한지, 어떤 시나리오가 유효하고 어떤 기준이 깨지면 철수해야 하는지를 함께 이해해야 합니다.<br><br>
                            그럴 때 비로소 차트 분석은 단순한 정보 소비가 아니라 <strong>실전 수익으로 연결되는 도구</strong>가 됩니다.
                        </p>
                    </div>
                </div>
            `;

            contentContainer.innerHTML = html;

            setTimeout(() => {
                document.querySelectorAll('.animate-draw').forEach(el => {
                    el.classList.remove('animate-draw');
                    void el.offsetWidth;
                    el.classList.add('animate-draw');
                });
            }, 50);

            scrollToTop();
            closeSidebar();
        }

        function renderContent(catKey, waveKey) {
            const waveData = theoryDB[catKey].waves[waveKey];
            const catName = theoryDB[catKey].name;
            const contentContainer = document.getElementById('theory-content');

            document.querySelectorAll('.wave-btn').forEach(btn => {
                btn.classList.remove('bg-slate-700', 'text-white', 'border-slate-600', 'shadow-md');
                btn.classList.add('bg-transparent', 'border-transparent', 'text-slate-400');
                if (btn.dataset.wave === waveKey) {
                    btn.classList.add('bg-slate-700', 'text-white', 'border-slate-600', 'shadow-md');
                    btn.classList.remove('bg-transparent', 'border-transparent', 'text-slate-400');
                }
            });
            const introBtn = document.getElementById('btn-intro');
            if (introBtn) {
                introBtn.classList.remove('border-amber-400', 'ring-2', 'ring-amber-400/30', 'shadow-[0_0_20px_rgba(251,191,36,0.3)]');
                introBtn.classList.add('border-transparent');
            }

            let html = `
                <div class="mb-10">
                    <span class="inline-block bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold px-3 py-1 rounded-full text-xs mb-3">
                        ${catName}
                    </span>
                    <h1 class="text-3xl md:text-5xl font-black tracking-tight text-white">${waveData.name}</h1>
                </div>
            `;

            const orderPriority = { "concept": 1, "features": 2, "rules": 3 };
            const sortedTypes = Object.entries(waveData.types).sort((a, b) => {
                return (orderPriority[a[0]] || 99) - (orderPriority[b[0]] || 99);
            });

            for (const [typeKey, typeData] of sortedTypes) {
                html += `
                    <div class="mb-12">
                        <h2 class="text-xl md:text-2xl font-black text-indigo-400 mb-6 flex items-center gap-2 border-b border-slate-700 pb-3">
                            <i class="fas fa-bookmark text-sm"></i> ${typeData.name}
                        </h2>
                        <div class="space-y-6">
                `;

                for (const [itemKey, itemData] of Object.entries(typeData.items)) {
                    html += `
                        <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 md:p-8 shadow-lg relative overflow-hidden">
                            <div class="absolute -top-4 -right-4 text-slate-700/30 text-6xl font-black italic pointer-events-none select-none">
                                ${typeData.name.includes('절대 규칙') ? 'RULE' : 'INFO'}
                            </div>

                            <h3 class="text-lg md:text-xl font-bold text-slate-100 mb-4 flex items-start gap-2 relative z-10">
                                <i class="fas ${typeData.name.includes('절대 규칙') ? 'fa-exclamation-triangle text-rose-400' : 'fa-check-circle text-emerald-400'} mt-1 text-base"></i> 
                                <span>${itemData.title}</span>
                            </h3>
                            
                            <div class="text-slate-300 leading-relaxed text-sm md:text-base relative z-10 space-y-4">
                                <p>${itemData.content}</p>
                            </div>
                    `;

                    if (itemData.svgChart) {
                        html += `
                            <div class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 md:p-6 shadow-inner mt-6 relative z-10">
                                <div class="w-full flex justify-center">
                                    <div class="w-full max-w-[100%] md:max-w-[750px] aspect-[16/9] md:aspect-[2/1] relative">
                                        ${itemData.svgChart}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    if (itemData.tip) {
                        html += `
                            <div class="mt-8 p-4 md:p-5 bg-indigo-900/20 border border-indigo-500/30 rounded-xl text-indigo-200 text-sm leading-relaxed relative z-10">
                                ${itemData.tip}
                            </div>
                        `;
                    }

                    if (itemData.tipSvgChart) {
                        html += `
                            <div class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 md:p-6 shadow-inner mt-4 relative z-10">
                                <div class="w-full flex justify-center">
                                    <div class="w-full max-w-[100%] md:max-w-[750px] aspect-[16/9] md:aspect-[2/1] relative">
                                        ${itemData.tipSvgChart}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                }
                html += `</div></div>`;
            }

            contentContainer.innerHTML = html;

            setTimeout(() => {
                document.querySelectorAll('.animate-draw, .seq-draw, .seq-fade').forEach(el => {
                    const currentClass = el.className.baseVal || el.className;
                    el.setAttribute('class', '');
                    void el.offsetWidth;
                    el.setAttribute('class', currentClass);
                });
            }, 50);

            scrollToTop();
            closeSidebar();
        }
    </script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileNav = document.getElementById('mobile-nav');
        if (menuToggle && mobileNav) {
            const menuIcon = menuToggle.querySelector('i');
            menuToggle.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                if (mobileNav.classList.contains('active')) {
                    menuIcon.classList.replace('fa-bars', 'fa-times');
                } else {
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                }
            });
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                    menuIcon.classList.replace('fa-times', 'fa-bars');
                });
            });
        }
    </script>
</body>

</html>
